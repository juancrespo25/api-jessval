services:
  system-ms-operaciones:
    image: juancrespo25/ms-operaciones-app:${IMAGE_TAG:-latest}
    container_name: system-ms-operaciones
    environment:
      PORT: ${PORT}
      HOST: ${HOST}
      DB_TYPE: ${DB_TYPE}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      DB_NAME: ${DB_NAME}
      DB_SYNC: ${DB_SYNC}
      DB_LOG: ${DB_LOG}
      DB_POOL_SIZE: ${DB_POOL_SIZE}
    restart: always
    ports:
      - "4006:4006"
    networks:
      - system-network

networks:
  system-network:
    external: true
