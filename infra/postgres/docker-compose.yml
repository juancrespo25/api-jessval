services:
  postgres:
    image: postgres:16
    container_name: jessval-postgres
    restart: always

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Subdirectory avoids initdb errors when the mount root is not empty
      PGDATA: /var/lib/postgresql/data/pgdata

    # Bound to localhost: services reach it through system-network, not the public port
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

    # Fixed host path: any new instance pointing here reuses the same data
    volumes:
      - ${POSTGRES_DATA_PATH:-/var/docker-file/sistema/data/postgres}:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - system-network

networks:
  system-network:
    name: system-network
    driver: bridge
