name: ms-auth

on:
  push:
    branches:
      - main
    paths:
      - 'apps/ms-auth/**'
      - '.github/workflows/ms-auth.yml'
  workflow_dispatch:

concurrency:
  group: ms-auth-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: juancrespo25/ms-auth-app
  APP_PATH: apps/ms-auth

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_PATH }}
          file: ${{ env.APP_PATH }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ms-auth
          cache-to: type=gha,mode=max,scope=ms-auth
