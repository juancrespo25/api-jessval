name: ms-gateway

on:
  push:
    branches:
      - main
    paths:
      - 'apps/ms-gateway/**'
      - '.github/workflows/ms-gateway.yml'
  workflow_dispatch:

concurrency:
  group: ms-gateway-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: juancrespo25/ms-gateway-app
  APP_PATH: apps/ms-gateway
  VPS_PATH: /var/docker-file/sistema/app/ms-gateway

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Compute image tag
        id: tag
        run: echo "image_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.APP_PATH }}
          file: ${{ env.APP_PATH }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ms-gateway
          cache-to: type=gha,mode=max,scope=ms-gateway

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ${{ env.VPS_PATH }}

            # Update only IMAGE_TAG; keep the other variables of the server .env
            touch .env
            sed -i '/^IMAGE_TAG=/d' .env
            [ -n "$(tail -c1 .env)" ] && echo >> .env
            echo "IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}" >> .env

            docker compose -p system pull
            docker compose -p system up -d

            docker image prune -f
